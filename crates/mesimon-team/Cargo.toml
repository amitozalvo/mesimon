[package]
name = "mesimon-team"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Board sharing for mesimon: device keys, board keys, invite codes, the relay wire protocol and its TLS client"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
# Board-key crypto (T-332): one board key per board, wrapped to each member's
# X25519 key and signed by the wrapper's Ed25519 key; records sealed with
# XChaCha20-Poly1305 so nonces are random and never counted.
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
# The relay client: TLS with either a pinned certificate (self-hosted) or the
# Mozilla roots (managed).
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"

[lints]
workspace = true

[lib]
doctest = false
