[package]
name = "mesimon-team"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Board sharing for mesimon: device keys, board keys, invite codes, the relay wire protocol and its TLS client"

[features]
default = ["native"]
native = ["dep:rustls", "dep:webpki-roots", "dep:tungstenite"]

[dependencies]
tungstenite = { version = "0.26", optional = true, default-features = false, features = ["handshake"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
# Board-key crypto (T-332): one board key per board, wrapped to each member's
# X25519 key and signed by the wrapper's Ed25519 key; records sealed with
# XChaCha20-Poly1305 so nonces are random and never counted.
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
# The relay client: TLS with either a pinned certificate (self-hosted) or the
# Mozilla roots (managed).
rustls = { optional = true, version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = { version = "1", optional = true }

[lints]
workspace = true

[lib]
doctest = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
