[package]
name = "mesimon-tui"
description = "The ratatui board client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mesimon-core.workspace = true
mesimon-daemon = { path = "../mesimon-daemon" }
anyhow.workspace = true
serde_json.workspace = true
ulid.workspace = true
uuid.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
ratatui = { version = "0.29", features = ["underline-color"] }
libc = "0.2"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
image = { version = "=0.25.6", default-features = false, features = ["png"] }
base64 = "0.22"
# 06 §2.9: OSC-11 background query at startup (reads /dev/tty directly, which
# sidesteps the T-4 attach-query stdin race)
terminal-colorsaurus = "1"
semver = "1.0.28"
# The release checker verifies the published .sha256 before it replaces the
# binary at our own path. Same major as the daemon's, per the dup-dep gate.
sha2 = "0.10"

[lints]
workspace = true

[lib]
# No doctests exist; rustdoc otherwise costs ~4 s of every `cargo test`.
doctest = false
