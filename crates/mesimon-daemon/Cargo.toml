[package]
name = "mesimon-daemon"
description = "mesimond — per-repo daemon: single writer of board state, session lifecycle, attention"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mesimon-core.workspace = true
mesimon-team.workspace = true
mesimon-backend-tmux = { path = "../mesimon-backend-tmux" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ulid.workspace = true
uuid.workspace = true
libc = "0.2"
sha2 = "0.10"
# Codex's private Unix endpoint uses WebSocket framing, without TLS/TCP.
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[lib]
# No doctests exist; rustdoc otherwise costs ~4 s of every `cargo test`.
doctest = false
