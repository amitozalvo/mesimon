[alias]
# Unit tests only (core, daemon, tui goldens, the binary's own). About 20 s to
# run after the build (daemon 13 s, tui 5 s); the inner loop is
# `cargo test -p <crate> --lib <filter>`. AGENTS.md says when the full suite is owed (T-661).
ut = "test --workspace --lib --bins"

# Browser randomness is supplied by Web Crypto for Mesophon's Wasm facade.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", 'getrandom_backend="wasm_js"']
