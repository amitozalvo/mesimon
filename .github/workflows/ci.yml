name: ci

# The Linux job runs on every push to main and every pull request: a fresh
# checkout, an empty ~/.local/state, no leftover tmux servers — the clean-room
# check a laptop cannot give you, and the machine a WSL tester looks like. The
# real release gate is still `ci/release.sh`, which runs this same suite
# locally before it will cut a release — on macOS directly, and on Linux in
# Docker (ci/test-linux.sh).
#
# The macOS job is manual (Actions tab, or `gh workflow run ci.yml`): the macOS
# target mesimon ships is the machine it is developed on, and a shared runner
# adds minutes, not evidence.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        # Arguments for `cargo nextest run` in place of the whole suite, e.g.
        # `-p mesimon --test hook_e2e m2_attention` or
        # `-E 'binary(crown_e2e) & test(/wake/)'`: a fix round's run answers
        # in the build time plus its tests, and skips the other gates. Empty
        # runs everything (T-1019; nextest since T-1023).
        description: "cargo nextest run arguments to run in place of the whole suite"
        required: false
        default: ""
      road:
        # Which road a named run's Claude launches take: the mod road's reds
        # are chased with `mod`. The whole suite always runs both.
        description: "road for the named tests"
        type: choice
        options: [hooks, mod]
        default: hooks

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The e2e suite skips itself when tmux is missing, which would make a runner
  # without tmux report a fully green suite that ran almost nothing. This turns
  # that skip into a hard failure.
  MESIMON_REQUIRE_TMUX: '1'
  # Relaxes the two wall-clock assertions (a 150 ms p99 on ten debug-build hook
  # spawns) that are honest locally and flaky on a shared runner.
  MESIMON_CI: '1'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 is x86_64 with apt's tmux 3.4 — a distro tmux, which is
        # the point: every tmux before 3.6 sanitizes format output differently
        # from the one bundled on macOS, and the suite has to pass on what a
        # Linux user has. macos-14 is arm64, the macOS target shipped, and joins
        # only on a manual dispatch. (A job-level `if` cannot see `matrix`, so
        # the event picks the matrix instead.)
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-24.04", "macos-14"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5

      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get install -y tmux; fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Saved after a red run too: a red run is the one a fix round follows,
      # and without this every such round built from nothing (T-1023).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The suite runs every test in its own process, all binaries at once:
      # `cargo test` ran the e2e binaries one after another (T-1023).
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.143

      - name: Versions
        run: |
          rustc --version
          cargo --version
          cargo nextest --version
          tmux -V
          git --version

      # No `cargo fmt --check` gate. This codebase has never been rustfmt'd —
      # `--check` reports 878 diffs against a deliberate hand style — so
      # turning it on would mean a repo-wide reformat, which is a decision for
      # a quiet day and its own commit, not a side effect of adding CI.

      - name: Clippy
        if: inputs.tests == ''
        run: python3 -B ci/test-run.py -- cargo clippy --workspace --all-targets -- -D warnings

      - name: Duplicate dependency drift
        if: inputs.tests == ''
        run: ./ci/check-dup-deps.sh

      # The mascot's PNGs and the installer's welcome are goldens of the creature
      # engine now (`cargo test -p mesimon-tui creature`), covered by the Test step.
      - name: Installer
        if: inputs.tests == ''
        run: python3 -B ci/test_installer.py

      # Both roads' passes, measured on 2026-10-25 under `cargo test` (T-1019):
      # 24 + 23 min on ubuntu-24.04, 34 + 33 min on macos-14. --no-fail-fast
      # carries to the mod road's pass, which runs after a red first pass
      # too, so one run reports every red. test-run.py's own 1200 s default
      # is the local release gate's and stays.
      #
      # The e2es spend their time on their own timers, not the CPU: a test
      # takes as long here as on a laptop (crown_e2e's 92 tests sum to about
      # 1,940 s at 4, 8 and 16 threads alike), so the runner runs many more
      # tests than it has cores. Both passes and a named run read it; a
      # named run's own --test-threads wins (T-1023).
      - name: Test
        if: inputs.tests == ''
        env:
          NEXTEST_TEST_THREADS: '16'
        run: python3 -B ci/test-run.py --timeout 5400 -- cargo nextest run --workspace --no-fail-fast

      # The input rides an environment variable, never the script's text, and
      # is split into words as a shell would quote them (shlex), so a filter
      # expression with spaces stays one word; nothing is evaluated.
      - name: Test (only what the dispatch names)
        if: inputs.tests != ''
        env:
          TESTS: ${{ inputs.tests }}
          MESIMON_TEST_ROAD: ${{ inputs.road }}
          NEXTEST_TEST_THREADS: '16'
        run: |
          python3 -B -c 'import os, shlex, sys; os.execvp(sys.executable, [sys.executable, "-B", "ci/test-run.py", "--one-road", "--", "cargo", "nextest", "run", "--no-fail-fast", *shlex.split(os.environ["TESTS"])])'

      - name: Test cleanup failure paths and runner concurrency
        if: inputs.tests == ''
        run: python3 -B ci/test-run.py -- python3 -B -m unittest discover -s ci -p 'test_*_test.py' -v
