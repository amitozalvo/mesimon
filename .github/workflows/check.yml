name: focused checks

# A small compile-and-core check, dispatched by hand like ci.yml: the local
# gate (ci/test-run.py on the author's Mac) is the release bar, and hosted
# runs are off until T-1030 revisits them (2026-10-26). Not a replacement for
# the process/timing-heavy matrix or the release gate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focused-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Compile every Rust target
        run: cargo check --workspace --all-targets --locked
      - name: Pure core behavior
        run: cargo test -p mesimon-core --lib --locked
      - name: Runner and Codex evaluation contracts
        run: python3 -B -m unittest ci.test_run_test ci.codex_rig_test
