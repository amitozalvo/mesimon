# The rig's tests (T-588), in run order. `ci/rig.py` files one ticket per
# test and drives them one at a time through the rig's crown.
#
# Per test:
#   title      what it proves, and the ask: the ticket's title. A start types
#              the title and pastes the description, and Claude Code wraps a
#              paste in <pasted_content> and follows instructions inside only
#              where the person's own words ask (measured: a worker given a
#              bare title declined R3's steps), so the title asks.
#   workspace  worktree | shared_checkout, said to the crown in its words.
#   brief      the ticket's description: with the title, the worker's whole
#              first prompt (a start's prompt is the title and description).
#   expect     the acceptance, in words: the crown's brief carries it, and
#              the verdict note repeats it.
#   blind      `true` (T-930) where the test judges what the crown decides
#              from the board's own words: the crown's brief, the test card
#              and the ticket's title (`<id> · do the steps below`) carry no
#              word of `expect`, which only the verdict note repeats; the
#              crown brief's scripting rules are lifted in it.
#   steps      in order. A `crown` step is words the rig sends the crown as a
#              prompt ({key} is the test ticket's key); the rig then waits
#              for `until` on the worker and for the crown to settle. A `rig`
#              step is something the rig does itself: `ping` (the mod road,
#              timed), `restart` (SIGTERM the rig's daemon and start it
#              again), `restart_old_claude` (the same with MESIMON_CLAUDE_BIN
#              naming a wrapper that says 2.1.286), `restart_mods_off` (the
#              same with a wrapper that starts every session without its
#              `--plugin-dir`: a Claude Code whose mods are off, T-598),
#              `restart_plain` (back to the Claude Code on PATH), `doctor`
#              (read its claude road line), `limit` (T-802: the worker's
#              session reports a usage limit through the real hook binary;
#              the step ends with the crown's turn on the board's wake).
#   until      for a crown step: `stops = N` (that many Stop frames from the
#              worker since the step began) and/or `events = [...]`, then the
#              worker's card word `state` (working | needs_you | idle |
#              sleeping). `filed = true` (DL1) waits on the ticket the crown
#              filed and started in the step instead of the test's own. `all = true` waits on every ticket of the test,
#              `on = "key2"` on that sibling alone.
#   settle     for a crown step: false where the next step must follow at
#              once, without waiting for the crown's turn to end (P2).
#   wake       for a crown step: true where the board will wake the crown
#              for the worker once `until` holds, and the step ends with the
#              crown's turn on that wake. The board wakes a crown for a
#              delivery, an answered ask, a question or a raised hand, a
#              merge (T-414, T-469, T-527) and, since T-591, a turn that
#              finished with nothing pending; an /exit ends no turn and
#              wakes nobody, so that step ends when the crown is quiet.
#   checks     what the verdict reads, each a name `ci/rig.py` defines:
#              road:<mod|hooks>, plugin_dir, no_plugin_dir, started_by_crown,
#              started_by_person (the rig step `person_start` started it, W1),
#              cwd:<worktree|checkout>, first_prompt, words:<w1,w2,...> (the
#              card words seen, in order), hooks:<E1,E2,...> (hook frames the
#              daemon ingested), mod_alone, claude_road_mod, crown:<cmd>
#              (with `=N`, exactly N of them, T-880)
#              (a feed line of the crown's), pings, reply:<word> (the
#              worker's last answer, from its transcript), doctor:<words>,
#              final:<word>, reply_never:<w1,w2,...> (T-930: the worker's last
#              answer names none of them), board_fed:<cmd> (a board line about no
#              ticket since the test began), relaunched:<secs> (T-598: the
#              test's ticket relaunched on the hook set once, that soon after
#              its start_agent; a sibling never). `mod_alone` (T-577): no hook set, no MCP server
#              and no allow rule on argv, and every frame the daemon took for
#              the session came by the mod; it is a check only where a test's
#              acceptance names it; every verdict lists the session's lines.
#              The turn roads (T-575) add: first_prompt_exact (the first
#              prompt is the title, a blank line and the brief, byte for byte,
#              and no <pasted_content> wraps it), fed:<cmd> / not_fed:<cmd> (a
#              board feed line for the ticket, or none, since the test began),
#              no_own_key (T-715: no reply of the worker's spells its own
#              ticket's key), summary:<done>/<total>[+<plain>] (T-710: the worker's own notes carry a
#              `Summary` section with that many boxes ticked of that many,
#              read as the card reads them, and with `+<plain>` that many
#              plain rows (T-743); the observed line names the
#              headings it used instead), boxes_free:<w1,w2,...> (T-727: no
#              box of those notes' Summary holds any of the words, case
#              aside; a plain row may),
#              mod_report:<event>:<reason> (a report the worker's mod relayed),
#              prompts:N (user prompts in its transcript, a background
#              task's notification not counted), held (its second prompt
#              entered after its first turn's Stop), replies:<w1>,<w2>
#              (its replies, in order, each its word alone), file:<path>
#              (in its cwd, holding `brief_file`'s words), no_file:<path> (T-932:
#              no such path in its cwd), answered:<word> /
#              refused (the crown's answer_agent outcome for it, from the
#              feed, or none answered), unlanded (T-778: the ticket's branch
#              is not on the checkout's base), tier:<name> (T-808: the tier
#              the ticket's agent last launched on; the rig lays `rig-alt`
#              beside its own `rig`, the same model, for L2),
#              crown_line:<prefix>:<word> (T-810: the crown's last line
#              beginning <prefix> holds <word>, or with `!<word>` does not),
#              shell:<line> / shell_out:<text> / no_shell (T-876: the
#              worker's transcript records <line> as a `!` line that ran in
#              its box, some such line printed <text>, or no `!` line ran),
#              hand:<word> (T-908: the worker raised its hand on its own
#              ticket, the reason naming <word>, case aside),
#              crown_never:<w1,w2,...> (T-895: no Bash call of the crown's
#              since the test began holds any of the words, and no Monitor
#              ran: the board's wake is the wait), fed_after:<cmd>:<prefix>
#              (T-919: the ticket's first board line whose cmd begins
#              <prefix> follows its first <cmd> line, none before it),
#              filed (T-916: the crown started at least one agent since
#              the test began, and every ticket it started one on was filed
#              by the crown's session, its agent the crown's and the one
#              seat there, in that ticket's own worktree or on the shared
#              checkout with no worktree bound (the crown's choice, T-929),
#              and took a turn; one bad start fails),
#              crown_wrote_nothing:<names> (T-916: no Write, Edit or
#              NotebookEdit of the crown's since the test began, no Bash
#              command of its that writes naming one of the names, and no
#              move of the checkout's HEAD or tree in a span the crown was
#              in a turn at either end of, or its agent in none (T-929: the
#              rest is a shared-checkout agent's own), a board worktree
#              branch's tip a fast-forward left there aside),
#              held_for_person (T-918: the crown's wake waited the whole of
#              `person_leaves`' stay, its row `when you leave`, and went in
#              within 10 s of the person leaving; on the mod road, T-931, it
#              went by the mod's submit within 10 s of being owed, the person
#              still in, its row never saying it waited).
#   siblings   more tickets the test files beside its own ({key2}, {key3}
#              in a step; {crown} is the rig's crown's own key), each with
#              the same brief and every check run on
#              each.
#   long_brief `true` appends 10 KB of numbered filler to the brief (P1); a
#              number appends that many bytes (B1), and `tail` is the
#              paragraph written after the filler, so a fact can sit last.
#   rig steps  W1 adds `person_start` (the person starts the test's agent
#              in its workspace; the step ends at its first turn's end).
#              The turn roads add: `prompt` (the person's words to the
#              worker while its turn runs, `text`, sent once it has worked
#              `after` seconds), `press_enter` (the person answers the
#              worker's dialog in its pane), `resend` (the person's resend of
#              the worker's unsent words), `picture_ask` (T-853: a solid PNG
#              of `color` uploaded and sent with `text`, whose `{link}` is
#              the picture's `[Image #1](mesimon-attachment:<id>)`),
#              `shell` (T-876: the person's `!` line, `text`, to the idle
#              worker; the step ends on the board's `shell_sent`),
#              `restart_drop_mod` (the daemon
#              again with MESIMON_MOD_DIR naming a copy of the mod whose first
#              submit in each session is dropped). `prs_board` (T-810) sets
#              Merge into: pull requests on a stub forge holding no PR; every
#              `forge_*` step that starts the stub sets it too, and
#              `forge_off` sets main back. `train_on` (T-919) arms the merge
#              train and takes the test ticket off the person's hold every
#              test is filed under, and with `block` puts an untracked file
#              at the checkout's root where the worker commits the same
#              path, so the train's merge is refused and nothing lands on
#              the ticket branch the rig runs in; `train_off` disarms it,
#              holds the ticket again and removes the file.
#              `person_in_crown` (T-918) puts a
#              tmux client on the crown's session, as the board's focus
#              would; `person_leaves` waits for the board to owe the crown
#              its wake, stays `hold` seconds watching the wake row and the
#              feed, then detaches and ends at the crown's turn on the wake.
#              `binary_moved` (T-941) moves the rig daemon's binary's mtime a
#              second on, bytes untouched, and `binary_back` restores it (DB1); a
#              crown step with `until = { crown_only = true }` waits on the
#              crown's settle alone, no worker.
#
# The prompts are explicit and small, so the repository's CLAUDE.md does not
# send a Sonnet worker off to work: a run is a few turns per test, cents.

[[test]]
id = "R1"
title = "R1 · a worker starts in a worktree on the mod road: do the steps below"
workspace = "worktree"
brief = "Reply with the single word done and end your turn. Read no file and run no command."
expect = "start_agent with workspace worktree; the brief is its first prompt; SessionRecord.road reads mod and argv carries --plugin-dir; the card goes working then idle; the feed has claude_road:mod; no hook set or MCP server rides argv and every frame came by the mod."
checks = ["road:mod", "plugin_dir", "started_by_crown", "cwd:worktree", "first_prompt", "words:working,idle", "hooks:SessionStart,UserPromptSubmit,Stop", "mod_alone", "claude_road_mod"]

  [[test.steps]]
  crown = "R1: call start_agent for {key} with workspace worktree, no tier and no plan, then end your turn with the single line: R1 started. When the board wakes you for {key}, end your turn with the single line: R1 seen."
  until = { stops = 1, state = "idle" }
  wake = true

[[test]]
id = "R2"
title = "R2 · a worker starts on the checkout on the mod road: do the steps below"
workspace = "shared_checkout"
brief = "Reply with the single word done and end your turn. Read no file and run no command."
expect = "start_agent with workspace shared_checkout; the same as R1, in the board's own checkout."
checks = ["road:mod", "plugin_dir", "started_by_crown", "cwd:checkout", "first_prompt", "words:working,idle", "hooks:SessionStart,UserPromptSubmit,Stop", "mod_alone"]

  [[test.steps]]
  crown = "R2: call start_agent for {key} with workspace shared_checkout, no tier and no plan, then end your turn with the single line: R2 started. When the board wakes you for {key}, end your turn with the single line: R2 seen."
  until = { stops = 1, state = "idle" }
  wake = true

[[test]]
id = "R3"
title = "R3 · every hook-set event reaches the daemon on the mod road and the card follows: do the steps below"
workspace = "worktree"
brief = """Do these four things one at a time, each only once the one before has finished, and nothing else.
1. Ask me one question with the AskUserQuestion tool, alone: the question is "Which colour?" and the two options are "red" and "blue". Wait for my answer.
2. Then run the shell command `echo` followed by the colour I chose, with the Bash tool.
3. Then start one subagent with the Agent tool (also called Task) whose whole prompt is "Reply with the single word ok.", and wait for its answer.
4. Then reply with the single word done and end your turn.
Read no file."""
expect = "a question (AskUserQuestion: needs-you; the crown answers it with answer_agent, blue), a tool, a subagent (SubagentStart/SubagentStop) and the turn's end (Stop): every event by the mod alone, the hook set passed nowhere, and the card's words working, needs-you and idle each seen."
checks = ["road:mod", "words:working,needs_you,working,idle", "hooks:UserPromptSubmit,PreToolUse,PostToolUse,SubagentStart,SubagentStop,Stop", "mod_alone", "crown:answer_agent"]

  [[test.steps]]
  crown = "R3: call start_agent for {key} with workspace worktree, no tier and no plan, then end your turn with the single line: R3 started. Its agent will stop on the question \"Which colour?\": when the board wakes you for that question, read it with get_ticket for {key}, answer it with answer_agent choosing blue, and end your turn with the single line: R3 answered. When the board wakes you because {key}'s agent finished, end your turn with the single line: R3 seen."
  until = { stops = 1, state = "idle" }
  wake = true

[[test]]
id = "R4"
title = "R4 · a daemon restart mid-session loses no frame: do the steps below"
workspace = "worktree"
brief = "Reply with the single word ready and end your turn. Read no file and run no command."
expect = "mesimon state ping answers before; the rig's daemon is stopped with SIGTERM and started again; ping answers after (the bridge reconnected with its backoff); the next turn, asked by the crown, arrives by the mod."
checks = ["road:mod", "pings", "hooks:UserPromptSubmit,Stop", "mod_alone", "crown:ask_agent"]

  [[test.steps]]
  crown = "R4: call start_agent for {key} with workspace worktree, no tier and no plan, then end your turn with the single line: R4 started. When the board wakes you for {key}, end your turn with the single line: R4 ready."
  until = { stops = 1, state = "idle" }
  wake = true

  [[test.steps]]
  rig = "ping"

  [[test.steps]]
  rig = "restart"

  [[test.steps]]
  rig = "ping"

  [[test.steps]]
  crown = "R4, after the board's daemon restarted: call ask_agent for {key} with the text: Reply with the single word again and end your turn. Then end your turn with the single line: R4 asked. When the board wakes you because {key}'s agent answered, end your turn with the single line: R4 seen."
  until = { stops = 1, state = "idle" }
  wake = true

[[test]]
id = "R5"
title = "R5 · sleep and wake keep the conversation on the mod road: do the steps below"
workspace = "worktree"
brief = "Remember the word mango. Reply with the single word done and end your turn. Read no file and run no command."
expect = "the crown parks the worker with sleep_agent once it is done and wakes it with start_agent; the woken session's road is decided again and reads mod; its next turn answers from the conversation it had (mango)."
checks = ["road:mod", "plugin_dir", "words:working,idle,sleeping,working,idle", "crown:sleep_agent", "crown:start_agent", "crown:ask_agent", "reply:mango"]

  [[test.steps]]
  crown = "R5: call start_agent for {key} with workspace worktree, no tier and no plan, then end your turn with the single line: R5 started. When the board wakes you for {key}, end your turn with the single line: R5 ready."
  until = { stops = 1, state = "idle" }
  wake = true

  [[test.steps]]
  crown = "R5, its agent is done: do three things in order. Call sleep_agent for {key}. Then call start_agent for {key} with workspace worktree again, which wakes the parked agent. Then call ask_agent for {key} with the text: Which word were you asked to remember? Reply with that word alone and end your turn. Then end your turn with the single line: R5 asked. When the board wakes you because {key}'s agent answered, end your turn with the single line: R5 seen."
  until = { stops = 1, state = "idle" }
  wake = true

[[test]]
id = "R8"
title = "R8 · words to a parked agent are its wake: do the steps below"
workspace = "worktree"
brief = "Remember the word kiwi. Reply with the single word done and end your turn. Read no file and run no command."
expect = "the crown parks its done worker with sleep_agent; then, asked only to put a question to it, it calls ask_agent and no start_agent, because the receipt says the words woke the parked agent (wake: woken, T-880). The worker wakes in its conversation and answers kiwi; start_agent is fed once, for the first start alone."
checks = ["started_by_crown", "words:working,idle,sleeping,working,idle", "crown:sleep_agent", "crown:ask_agent", "crown:start_agent=1", "reply:kiwi"]

  [[test.steps]]
  crown = "R8: call start_agent for {key} with workspace worktree, no tier and no plan, then end your turn with the single line: R8 started. When the board wakes you for {key}, end your turn with the single line: R8 ready."
  until = { stops = 1, state = "idle" }
  wake = true

  [[test.steps]]
  crown = "R8, its agent is done: call sleep_agent for {key}, then end your turn with the single line: R8 parked."
  until = { state = "sleeping" }

  [[test.steps]]
  crown = "R8: ask {key}'s agent which word it was asked to remember, to be answered with that word alone, then end your turn with the single line: R8 asked. When the board wakes you because {key}'s agent answered, end your turn with the single line: R8 seen."
  until = { stops = 1, state = "idle" }
  wake = true

[[test]]
id = "R6"
title = "R6 · pane-died still ends a session on the mod road: do the steps below"
workspace = "worktree"
brief = "Reply with the single word done and end your turn. Read no file and run no command."
expect = "the crown sends the worker /exit; the pane dies, tmux's pane-died ends the session and the record parks as sleeping, its worktree kept; SessionEnd arrives by the mod; nothing of the mod stands in the way."
checks = ["road:mod", "hooks:SessionEnd,PaneDied", "mod_alone", "crown:ask_agent", "final:sleeping"]

  [[test.steps]]
  crown = "R6: call start_agent for {key} with workspace worktree, no tier and no plan, then end your turn with the single line: R6 started. When the board wakes you for {key}, end your turn with the single line: R6 ready."
  until = { stops = 1, state = "idle" }
  wake = true

  [[test.steps]]
  crown = "R6, its agent is done: call ask_agent for {key} with the text /exit, then end your turn with the single line: R6 sent."
  until = { events = ["SessionEnd"], state = "sleeping" }

[[test]]
id = "R7"
title = "R7 · a Claude Code too old for mods gets the hook set with no visible difference: do the steps below"
workspace = "worktree"
brief = "Reply with the single word done and end your turn. Read no file and run no command."
expect = "the rig's daemon restarted with MESIMON_CLAUDE_BIN naming a wrapper that answers --version with 2.1.286 and otherwise runs the real Claude Code: the worker's road reads hooks, no --plugin-dir is passed, doctor says older than 2.1.287, and the turn runs as it did on the mod."
checks = ["road:hooks", "no_plugin_dir", "started_by_crown", "words:working,idle", "hooks:SessionStart,UserPromptSubmit,Stop", "doctor:older than 2.1.287"]

  [[test.steps]]
  rig = "restart_old_claude"

  [[test.steps]]
  crown = "R7: call start_agent for {key} with workspace worktree, no tier and no plan, then end your turn with the single line: R7 started. When the board wakes you for {key}, end your turn with the single line: R7 seen."
  until = { stops = 1, state = "idle" }
  wake = true

  [[test.steps]]
  rig = "doctor"

  [[test.steps]]
  rig = "restart_plain"

[[test]]
id = "R9"
title = "R9 · a Claude Code with mods off gets the hook set by itself: do the steps below"
siblings = ["R9 · the next worker after mods were found off"]
workspace = "worktree"
brief = "Reply with the single word done and end your turn. Read no file and run no command."
expect = "the rig's daemon restarted with MESIMON_CLAUDE_BIN naming a wrapper that validates the mod and passes the load probe but starts each session without its --plugin-dir, as 2.1.288 did with its remote flag off: the first worker's launch on the mod never reports, is relaunched on the hook set within 25 s (claude_road_relaunch), its brief arrives once and its card follows the turn; the feed has claude_road_fallback; doctor says mods are off; the second worker, started after, takes the hook set at once."
checks = ["road:hooks", "no_plugin_dir", "started_by_crown", "first_prompt", "prompts:1", "words:working,idle", "hooks:SessionStart,UserPromptSubmit,Stop", "relaunched:25", "board_fed:claude_road_fallback", "doctor:mods are off"]

  [[test.steps]]
  rig = "restart_mods_off"

  [[test.steps]]
  crown = "R9: call start_agent for {key} with workspace worktree, no tier and no plan, then end your turn with the single line: R9 started. When the board wakes you for {key}, end your turn with the single line: R9 seen."
  until = { stops = 1, state = "idle" }
  wake = true

  [[test.steps]]
  crown = "R9: call start_agent for {key2} with workspace worktree, no tier and no plan, then end your turn with the single line: R9 next started. When the board wakes you for {key2}, end your turn with the single line: R9 next seen."
  until = { stops = 1, state = "idle", on = "key2" }
  wake = true

  [[test.steps]]
  rig = "doctor"

  [[test.steps]]
  rig = "restart_plain"

# ---------------------------------------------------------------- the prompts
# T-575: on a Claude Code whose mod is up, every prompt mesimon delivers goes
# down the mod as $.prompt.submit({ text, asUser: true }): no composer is
# read, nothing is typed into the pane and no Enter is pressed.

[[test]]
id = "P1"
title = "P1 · a long brief reaches the worker whole as its first prompt"
workspace = "worktree"
brief = """This brief is long on purpose: it tests that a whole brief reaches you as your first prompt, word for word. Everything below the line is filler for that test; do not act on it.

When you have read it, reply with the single word done and end your turn. Read no file and run no command.

----
""" 
expect = "the crown starts the worker; its first prompt is the title, a blank line and the 10 KB brief, byte for byte, as the person's own words (no <pasted_content>); it went down the mod (prompt_by_mod) and neither the composer wait nor the paste road ran (no prompt_by_paste, no prompt_submit_not_ready); the worker answers done."
checks = ["road:mod", "started_by_crown", "first_prompt_exact", "fed:prompt_by_mod", "not_fed:prompt_by_paste", "not_fed:prompt_submit_not_ready", "hooks:SessionStart,UserPromptSubmit,Stop", "words:working,idle", "reply:done"]
long_brief = true

  [[test.steps]]
  crown = "P1: call start_agent for {key} with workspace worktree, no tier and no plan, then end your turn with the single line: P1 started. When the board wakes you for {key}, end your turn with the single line: P1 seen."
  until = { stops = 1, state = "idle" }
  wake = true

[[test]]
id = "B1"
title = "B1 · the one fact in the last paragraph of an 8 KiB brief reaches the worker: reply with the code word named in the last paragraph of this ticket's description, and end your turn"
workspace = "worktree"
brief = """The code word this test asks for is named in the LAST paragraph of this description, after the filler. Call get_ticket first, as your system prompt says, and take the description from its answer: if the answer says the description was cut, read_note on the first note returns the whole of it. Everything between here and the last paragraph is filler; do not act on it. Read no file and run no command."""
expect = "the crown starts the worker; its first prompt is the title, a blank line and the 8 KiB brief whole; get_ticket carries the whole description (under its 16 KiB cap, no description_cut); the worker replies with the code word from the last paragraph, tamarind; then the crown, which never saw the brief, reads it with get_ticket and names the same word."
checks = ["road:mod", "started_by_crown", "first_prompt_exact", "words:working,idle", "reply:tamarind", "crown_line:B1 word:tamarind"]
long_brief = 8000
tail = "The code word is tamarind. Reply with it alone and end your turn."

  [[test.steps]]
  crown = "B1: call start_agent for {key} with workspace worktree, no tier and no plan, then end your turn with the single line: B1 started. When the board wakes you for {key}, call get_ticket with key {key}, find the code word named in the LAST paragraph of its description (if get_ticket says the description was cut, read_note on its first note has the whole of it), and end your turn with the single line: B1 word: <that code word>."
  until = { stops = 1, state = "idle" }
  wake = true

[[test]]
id = "P2"
title = "P2 · a prompt into a running turn waits and runs as a turn of its own"
workspace = "worktree"
brief = "Count the files under /usr: run the shell command `find /usr -type f 2>/dev/null | wc -l` with the Bash tool in the foreground (never in the background) and wait for it to finish, then reply with the single word first and end your turn. Read no file and run no other command."
expect = "while the worker's first turn runs (its foreground find), the person sends it a prompt: it goes down the mod (prompt_by_mod), the engine holds it, and it runs as a second turn after the first one's Stop, never typed into the box: two prompts, the second entering after the first turn ended, the replies first then second."
checks = ["road:mod", "fed:prompt_by_mod", "not_fed:prompt_by_paste", "prompts:2", "held", "replies:first,second", "hooks:UserPromptSubmit,Stop"]

  [[test.steps]]
