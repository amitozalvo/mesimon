# ---------------------------------------------------------------- the dialogs
# T-576: a question's answer goes down the worker's mod as one frame, by the
# dialog's own labels; no screen is read and no key is sent, and the mod's
# report (no PostToolUse fires for a dialog it closed) moves the card.

[[test]]
id = "D1"
title = "D1 · the crown answers a worker's question through its mod: do the steps below"
workspace = "worktree"
brief = """Do these two things one at a time and nothing else.
1. Ask me one question with the AskUserQuestion tool, alone: the question is "Which colour?" and the two options are "red" and "blue". Wait for my answer.
2. Then reply with the colour I chose, as one word, and end your turn.
Read no file and run no command."""
expect = "the worker asks; the board wakes the crown, which answers blue with answer_agent; the answer goes down the worker's mod (answer_by_mod), the mod reports it answered (ModAnswer answered), the receipt says answered, and the card leaves needs-you on that report, with no PostToolUse of the hook set's (working first only when the reply outlasts the machine's 1.5 s settle); the worker replies blue."
