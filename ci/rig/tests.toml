  [[test.steps]]
  crown = "P6: call start_agent for {key} with workspace worktree, no tier and no plan, then end your turn with the single line: P6 started. When the board wakes you for {key}, end your turn with the single line: P6 ready."
  until = { stops = 1, state = "idle" }
  wake = true

