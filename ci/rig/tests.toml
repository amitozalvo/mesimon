# ---- Permissions and cost (T-581). A worker whose column runs Claude Code in
# manual mode (`column`: the rig lays RIG MANUAL with `claude_mode = manual`)
# asks before its Bash command. The phone's one-shot answer reaches the mod's
# hold in `classic.PermissionRequest` through the real `mesimon approve`; the
# rig stands in for the phone and the daemon's wait at the socket approve
