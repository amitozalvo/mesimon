[workspace]
resolver = "2"
members = [
    "crates/mesimon",
    "crates/mesimon-core",
    "crates/mesimon-daemon",
    "crates/mesimon-tui",
    "crates/mesimon-backend-tmux",
    "crates/mesimon-team",
    "team/relay",
]
# `team/relay` is the paid relay (T-332): `--workspace` commands cover it, a
# plain `cargo build`/`cargo run` does not, and neither does the release build.
default-members = [
    "crates/mesimon",
    "crates/mesimon-core",
    "crates/mesimon-daemon",
    "crates/mesimon-tui",
    "crates/mesimon-backend-tmux",
    "crates/mesimon-team",
]

[workspace.package]
version = "0.1.0-alpha.22"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/amitozalvo/mesimon"
rust-version = "1.85"

[workspace.dependencies]
mesimon-core = { path = "crates/mesimon-core" }
mesimon-daemon = { path = "crates/mesimon-daemon" }
mesimon-tui = { path = "crates/mesimon-tui" }
mesimon-backend-tmux = { path = "crates/mesimon-backend-tmux" }
mesimon-team = { path = "crates/mesimon-team" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
# D22/05: exactly one unicode-width major across the workspace; CI enforces via `cargo tree -d`
unicode-width = "0.2"
# 07 §4.1: card truncation is by grapheme cluster, never by char
unicode-segmentation = "1"
# T-349: the board's fuzzy search. The matcher behind Helix's picker — fzf's
# v2 scoring with match indices for highlighting. MPL-2.0, and it adds no
# transitive dependency the tree did not already carry (memchr,
# unicode-segmentation).
nucleo-matcher = "0.3"

[workspace.lints.clippy]
# D26: silent degradation is banned; unwraps in non-test code are review flags
unwrap_used = "warn"

[profile.dev]
# Backtraces keep file:line; the full DWARF was what made every core edit
# relink 23 test binaries slowly.
debug = "line-tables-only"
# Independent ticket builds multiplied incremental caches until the disk filled.
# Keep dependency artifacts, but rebuild changed workspace crates without this
# additional cache. A developer can opt back in with CARGO_INCREMENTAL=1.
incremental = false
